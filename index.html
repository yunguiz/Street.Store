<!doctype html>
<html lang="pt-BR" class="overflow-x-hidden w-full max-w-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress Vite HMR WebSocket errors in Cloud Run preview iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var text = String(reason && (reason.message || reason));
        if (text.includes('WebSocket') || text.includes('websocket')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = String(event.message || '');
        if (msg.includes('WebSocket') || msg.includes('websocket')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
    <title>Street Store - Autoridade no Streetwear</title>
